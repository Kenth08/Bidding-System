name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd next-app
          npm ci
      - name: Typecheck
        run: |
          cd next-app
          npx tsc --noEmit
      - name: Lint
        run: |
          cd next-app
          npx eslint . --ext .js,.ts,.tsx
